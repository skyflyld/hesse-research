name: 🔬 Hesse Research Daily News

on:
  # ⚠️ 已停用（2026-08-30）：cron 定时触发移除，避免重复自动化。
  # 每日碰撞追踪已由 OpenClaw cron hesse-collision-daily（北京 23:00）接管。
  # 保留 workflow_dispatch 供手动触发。
  workflow_dispatch:  # manual trigger only

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch Hesse research primary sources
        run: python .github/scripts/fetch-hesse-news.py

      - name: Commit and push
        run: |
          git config user.name "Ariste Hesse Bot"
          git config user.email "aristebot@users.noreply.github.com"
          git add -A
          # Only commit if there are changes (new data)
          git diff --quiet && git diff --staged --quiet || git commit -m "📡 Hesse research update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Notify Hesse Knowledge Graph
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN || github.token }}
          repository: jasoneip01-pixel/hesse-knowledge-graph
          event-type: hesse-news-update
          client-payload: '{"source": "hesse-research", "date": "${{ github.event.head_commit.timestamp || github.event.created_at || '' }}"}'
